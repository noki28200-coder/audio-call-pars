services:

  # ════════════════════════════════════════════════════════════
  # ИНФРАСТРУКТУРА
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-callsdb}
      POSTGRES_USER:     ${POSTGRES_USER:-callsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callsuser} -d ${POSTGRES_DB:-callsdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Не выставляем порт наружу — доступ только внутри сети

  # Применяет db/init.sql при каждом запуске (скрипт идемпотентный),
  # чтобы изменения схемы доезжали и до уже существующей БД.
  db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST:     postgres
      PGDATABASE: ${POSTGRES_DB:-callsdb}
      PGUSER:     ${POSTGRES_USER:-callsuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-callspassword}
    volumes:
      - ./db/init.sql:/init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/init.sql"]
    restart: "no"

  # S3-совместимое хранилище записей (SeaweedFS). MinIO больше не
  # распространяет образы, поэтому заменён. Бакет создают сами сервисы.
  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:8888:8888"   # Веб-интерфейс файлов (filer)
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3admin-secret}
    # Ключи доступа берутся из окружения: без конфига SeaweedFS пускает всех анонимно
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes:
      - s3_data:/data
    healthcheck:
      # Без подписи S3 отвечает 403 — главное, что отвечает
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092
      KAFKA_LISTENERS:                        PLAINTEXT://0.0.0.0:9092
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:               zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       "false"
      KAFKA_LOG_RETENTION_HOURS:             168
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./init-scripts/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # СЕРВИСЫ ПРИЛОЖЕНИЯ
  # ════════════════════════════════════════════════════════════

  # ── Главный API: REST для CRM + ручная загрузка ─────────────
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      S3_ENDPOINT:      http://s3:9000
      S3_ACCESS_KEY:    ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY:    ${S3_SECRET_KEY:-s3admin-secret}
      S3_BUCKET:        ${S3_BUCKET:-call-audios}
      API_KEY:          ${API_KEY:-dev-insecure-key}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Сборщик записей из МангоОфис (Go, pipeline/cmd/collector)
  mango-collector:
    build:
      context: ./pipeline
      args:
        SERVICE: collector
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    environment:
      POSTGRES_DSN:             postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:          kafka:9092
      S3_ENDPOINT:              http://s3:9000
      S3_ACCESS_KEY:            ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY:            ${S3_SECRET_KEY:-s3admin-secret}
      S3_BUCKET:                ${S3_BUCKET:-call-audios}
      MANGO_API_KEY:            ${MANGO_API_KEY}
      MANGO_API_SALT:           ${MANGO_API_SALT}
      MANGO_API_URL:            ${MANGO_API_URL:-https://app.mango-office.ru/vpbx}
      POLL_INTERVAL_SECONDS:    ${POLL_INTERVAL_SECONDS:-300}
      LOOKBACK_MINUTES:         ${LOOKBACK_MINUTES:-10}
      MAX_RETRIES:              ${MAX_RETRIES:-3}

  # ── WhisperX ML-сервис (Python, только инференс) ────────────
  whisperx-service:
    build: ./whisperx-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL:    ${WHISPER_MODEL:-medium}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      WHISPER_THREADS:  ${WHISPER_THREADS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Транскрибация звонков (Go, pipeline/cmd/transcriber) ────
  transcriber:
    build:
      context: ./pipeline
      args:
        SERVICE: transcriber
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      whisperx-service:
        condition: service_healthy
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      S3_ENDPOINT:      http://s3:9000
      S3_ACCESS_KEY:    ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY:    ${S3_SECRET_KEY:-s3admin-secret}
      S3_BUCKET:        ${S3_BUCKET:-call-audios}
      WHISPERX_URL:     http://whisperx-service:8001
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      MAX_RETRIES:      ${MAX_RETRIES:-3}

  # ── Анализ транскрипций (Go + Ollama / Gemma, pipeline/cmd/analyzer)
  analyzer:
    build:
      context: ./pipeline
      args:
        SERVICE: analyzer
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      OLLAMA_HOST:      http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-gemma3:4b}
      CRM_WEBHOOK_URL:  ${CRM_WEBHOOK_URL:-}
      MAX_RETRIES:      ${MAX_RETRIES:-3}

  # ── Nginx: точка входа ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  s3_data:
  ollama_models:
